<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiveStage – Hands-on demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f4;--surface:#fff;--surface2:#f4eee7;--line:#e8e0d6;--ink:#1a1d29;--muted:#5f6170;--accent:#d2461f;--accent-soft:#fcebe4;--accent-ink:#b23a17;
--navy:#1c2541;--navy2:#283357;--onnavy:#f4f1ec;--onnavy-muted:#aeb4c8;--gold:#e09a2d;--gold-soft:#fcf1de;--ok:#127a6b;--ok-soft:#dff2ee;--warn:#9a5b00;--warn-soft:#fbefd9;
--bad:#b4322a;--bad-soft:#f9e5e2;--info:#2a5bb8;--info-soft:#e5ecf8;--sh:0 1px 2px rgb(26 29 41/.04),0 4px 16px rgb(26 29 41/.06);--sh2:0 2px 4px rgb(26 29 41/.06),0 12px 32px rgb(26 29 41/.12);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.55 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{letter-spacing:-.015em;margin:0;text-wrap:balance}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}.muted{color:var(--muted)}.tnum{font-variant-numeric:tabular-nums}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:600}.bb{font-weight:700}
.price{color:var(--accent-ink);font-weight:700}.row{display:flex;align-items:center;gap:12px}.row.wrap-r{flex-wrap:wrap}.grow{flex:1;min-width:0}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:0;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn.sm{height:32px;padding:0 12px;font-size:13px}.btn.lg{height:48px;padding:0 24px;font-size:15px}
.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-ink)}.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--surface2)}.btn.light{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--sh)}.pad{padding:16px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-info{background:var(--info-soft);color:var(--info)}
.b-gold{background:var(--gold-soft);color:var(--warn)}.b-acc{background:var(--accent-soft);color:var(--accent-ink)}.b-neu{background:var(--surface2);color:var(--muted)}
input,select,textarea{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px;color:var(--ink)}textarea{height:auto;padding:8px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
label.f{display:block}label.f>span{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.err{color:var(--bad);font-size:13px;margin-top:6px}
/* header */
.demo-bar{background:var(--navy);color:var(--onnavy-muted);font-size:13px}.demo-bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:34px;flex-wrap:wrap}
.demo-bar .wrap>span:last-child{flex-wrap:wrap;min-width:0}.demo-bar select{height:26px;width:auto;max-width:200px;padding:0 6px;font-size:13px;background:var(--navy2);color:#fff;border-color:transparent}
header.top{position:sticky;top:0;z-index:40;background:rgb(255 255 255/.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;height:60px}.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.logo i{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;font-style:normal;font-size:15px}
nav.main a{padding:8px 10px;font-weight:500;font-size:14px;color:rgb(26 29 41/.75)}nav.main a:hover,nav.main a.on{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.lang button{border:0;background:#fff;padding:5px 10px;font-size:13px;cursor:pointer}.lang button.on{background:var(--ink);color:#fff}
/* hero */
.hero{position:relative;isolation:isolate;color:#fff;background:var(--navy);overflow:hidden}.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--navy),rgb(28 37 65/.85),rgb(28 37 65/.35))}
.hero .wrap{padding-top:64px;padding-bottom:64px}.hero h1{font-size:44px;line-height:1.1;max-width:640px}.hero h1 em{font-style:normal;color:#ff8a5c}
.search{margin-top:28px;max-width:820px;background:#fff;color:var(--ink);border-radius:12px;padding:8px;box-shadow:var(--sh2);display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;align-items:end}
.search label span{display:block;font-size:12px;color:var(--muted);margin:0 4px 4px}
.sec{margin-top:56px}.sec h2{font-size:24px;margin-bottom:16px}.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}.sec-h h2{margin:0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
/* artist tile */
.tile{position:relative;background:#fff;border-radius:12px;box-shadow:var(--sh);transition:.15s}.tile:hover{transform:translateY(-2px);box-shadow:var(--sh2);z-index:5}
.tile .ph{display:block;position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:12px 12px 0 0;background:var(--surface2)}.tile .ph img{width:100%;height:100%;object-fit:cover}
.tile .flags{position:absolute;left:8px;top:8px;display:flex;gap:4px}.tile .city{position:absolute;left:8px;bottom:8px;background:rgb(0 0 0/.55);color:#fff;font-size:12px;border-radius:6px;padding:2px 8px}
.tile .body{padding:12px 14px 14px}.name{font-weight:600;font-size:16px;cursor:pointer}.name:hover{color:var(--accent)}
.qv-wrap{position:relative;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.qv{position:absolute;left:0;top:100%;margin-top:8px;width:290px;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--sh2);font-size:14px;cursor:default}
.qv h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--muted)}.qv .ln{display:flex;gap:8px;margin:3px 0}.qv .ln span:first-child{width:48px;color:var(--muted);flex:none}
.qv-i{display:none;width:22px;height:22px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:11px;color:var(--muted)}@media (hover:none){.qv-i{display:inline-block}}
.stars{color:var(--gold)}
.trip{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:500;border-radius:6px;padding:2px 8px}
/* navy band */
.band{background:var(--navy);color:var(--onnavy);margin-top:56px}.band .wrap{padding-top:48px;padding-bottom:48px}.band h2{color:#fff}
.tripcard{display:flex;gap:14px;align-items:center;background:var(--navy2);border-radius:12px;padding:12px;color:#fff;cursor:pointer}.tripcard:hover{background:rgb(255 255 255/.1)}
.tripcard img{width:76px;height:76px;object-fit:cover;border-radius:8px}.chip-acc{background:var(--accent);color:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:1px 6px}
/* list rows */
.rowcard{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:16px;padding:14px}.rowcard img{width:150px;height:150px;object-fit:cover;border-radius:8px}
.quote{border-left:2px solid rgb(210 70 31/.4);padding-left:10px;font-size:14px;color:var(--muted)}
.navyhead{background:var(--navy);color:#fff}.navyhead .wrap{padding-top:36px;padding-bottom:60px}.navyhead h1{font-size:30px}
/* profile */
.gallery{display:grid;grid-template-columns:3fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:340px;border-radius:12px;overflow:hidden;margin-top:24px}
.gallery img{width:100%;height:100%;object-fit:cover}.gallery img:first-child{grid-row:span 2}
.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:36px;margin-top:24px;align-items:start}
.sticky{position:sticky;top:84px}
.box{background:#fff;border-radius:12px;box-shadow:var(--sh2);border-top:4px solid var(--accent);padding:20px}
.daychip{display:inline-block;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-size:13px;font-weight:500;padding:3px 8px;margin:3px 3px 0 0;cursor:pointer}
.list{border-top:1px solid var(--line)}.list>div{display:flex;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.tripline{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.secp{margin-top:32px}.secp h2{font-size:20px;margin-bottom:12px}
/* booking */
.bk{margin-top:18px}.bk section{margin-bottom:18px}.bk section>h3{padding:12px 16px;border-bottom:1px solid var(--line);font-size:16px;display:flex;justify-content:space-between;align-items:center}
.bk section>div{padding:16px}.kv{display:flex;justify-content:space-between;gap:16px;padding:5px 0;font-size:14px}.kv>span:first-child{color:var(--muted);flex:none}.kv>span:last-child{text-align:right}
.msg{max-width:85%;border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}.msg.me{margin-left:auto;background:var(--accent);color:#fff}.msg.other{background:var(--surface2)}.msg.admin{background:var(--info-soft)}
.msg .meta{font-size:12px;opacity:.75;margin-bottom:2px}
.lock{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px}
.hl{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px;transition:outline-color .3s}
/* dashboard */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:20px;overflow-x:auto}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-size:14px;white-space:nowrap}
.tabs button.on{border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
.cal>div{background:#fff;min-height:78px;padding:5px 6px;cursor:default}.cal .dow{min-height:0;color:var(--muted);font-size:12px}.cal .out{opacity:.4}.cal .free{cursor:pointer}.cal .free:hover{background:var(--surface2)}
.cal .busy{background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,var(--line) 6px 7px)}.cal .trip{border-top:3px solid var(--accent);display:block;background:#fff;border-radius:0;color:inherit;padding:5px 6px;font-weight:400}
.cal .ev{display:block;margin-top:3px;border-radius:4px;padding:1px 4px;font-size:11px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.ev.pub{background:var(--ink)}.ev.prv{background:var(--info)}
.legend span{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12px;color:var(--muted)}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}th{font-weight:500;font-size:12px;color:var(--muted)}
/* guide */
.fab{position:fixed;right:18px;bottom:18px;z-index:60;box-shadow:var(--sh2)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:#fff;z-index:70;box-shadow:-10px 0 40px rgb(0 0 0/.18);display:flex;flex-direction:column}
.drawer header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.drawer .bd{overflow:auto;padding:14px 18px 24px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}.step .tag{background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;box-shadow:var(--sh2)}
footer{margin-top:64px;background:var(--navy);color:var(--onnavy-muted);font-size:13px}footer .wrap{padding:22px 16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:860px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.two{grid-template-columns:1fr}.sticky{position:static}
.search{grid-template-columns:1fr}.hero h1{font-size:32px}nav.main{display:none}.gallery{height:220px;grid-template-columns:1fr}.gallery img:not(:first-child){display:none}
.rowcard{grid-template-columns:96px minmax(0,1fr)}.rowcard img{width:96px;height:96px}.rowcard>.end{grid-column:2}}
</style>
</head>

/* ---------------- state ---------------- */
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { S = seed(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* private mode: keep in memory */ } };
const t = (k, vars = {}) => Object.entries(vars).reduce((s, [a, b]) => s.replace(`{${a}}`, b), (DICT[S.lang][k] ?? DICT.en[k] ?? k));
const L = (o) => (o && typeof o === "object" ? o[S.lang] ?? o.en : o);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const artist = (id) => S.artists.find((a) => a.id === id);
const bySlug = (slug) => S.artists.find((a) => a.slug === slug);
const money = (c) => "$" + (c / 100).toLocaleString("en-CA", { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 });
const now = () => { const d = new Date(); const p = (n) => String(n).padStart(2, "0"); return `${TODAY} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const pyd = (ymd) => { const [y, m, d] = ymd.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const addDays = (ymd, n) => { const d = pyd(ymd); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"], DOW_EN = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], DOW_VI = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
function fdate(ymd, long = false) {
  const d = pyd(ymd), dd = d.getUTCDate(), m = d.getUTCMonth();
  if (S.lang === "vi") return (long ? DOW_VI[d.getUTCDay()] + ", " : "") + `${String(dd).padStart(2, "0")}/${String(m + 1).padStart(2, "0")}${long ? "/" + d.getUTCFullYear() : ""}`;
  return (long ? DOW_EN[d.getUTCDay()] + ", " : "") + `${MON[m]} ${dd}${long ? ", " + d.getUTCFullYear() : ""}`;
}
function frange(a, b) {
  const x = pyd(a), y = pyd(b);
  if (S.lang === "vi") return `${x.getUTCDate()}–${String(y.getUTCDate()).padStart(2, "0")}/${String(y.getUTCMonth() + 1).padStart(2, "0")}`;
  return x.getUTCMonth() === y.getUTCMonth() ? `${MON[x.getUTCMonth()]} ${x.getUTCDate()}–${y.getUTCDate()}` : `${fdate(a)} – ${fdate(b)}`;
}
const stamp = (s) => (s ? `${fdate(s.slice(0, 10))} ${s.slice(11, 16)}` : "");

/* ---------------- business rules (same as the app's src/server/domain) ---------------- */
const HOLDS = ["pending_payment", "confirmed", "completed"];
const travelOn = (a, d) => a.travel.find((w) => w.from <= d && d <= w.to) || null;
function availableOn(a, city, d) {
  if (a.blocked.includes(d) || S.bookings.some((b) => b.artist === a.id && b.date === d && HOLDS.includes(b.status))) return null;
  const trip = travelOn(a, d);
  if (trip) return trip.city === city ? "travel" : null;
  if (a.home === city) return "home";

function calendar(a) {
  const [y, m] = calMonth.split("-").map(Number), first = `${calMonth}-01`, start = addDays(first, -((pyd(first).getUTCDay() + 6) % 7));
  const days = Array.from({ length: 42 }, (_, i) => addDays(start, i));
  const title = S.lang === "vi" ? `Tháng ${m}/${y}` : pyd(first).toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
  const dows = S.lang === "vi" ? ["T2", "T3", "T4", "T5", "T6", "T7", "CN"] : ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  return `<div class="row wrap-r" style="justify-content:space-between;margin:16px 0 10px"><div class="row"><button class="btn sm ghost" data-act="month" data-v="-1">←</button><b style="min-width:140px;text-align:center">${title}</b><button class="btn sm ghost" data-act="month" data-v="1">→</button></div>
    <div class="legend"><span><i style="background:var(--ink)"></i>${t("legPub")}</span><span><i style="background:var(--info)"></i>${t("legPrv")}</span><span><i style="background:var(--line)"></i>${t("legBusy")}</span><span><i style="background:var(--accent)"></i>${t("legTrip")}</span></div></div>
  <div class="cal">${dows.map((d) => `<div class="dow">${d}</div>`).join("")}${days.map((d) => {
    const bs = S.bookings.filter((b) => b.artist === a.id && b.date === d && HOLDS.includes(b.status)), busy = a.blocked.includes(d), trip = travelOn(a, d), inM = d.startsWith(calMonth), canToggle = !bs.length && d >= TODAY;
    return `<div class="${inM ? "" : "out"} ${busy ? "busy" : ""} ${trip ? "trip" : ""} ${canToggle ? "free" : ""}" ${canToggle ? `data-act="toggleDay" data-v="${d}"` : bs.length ? `data-act="open" data-h="#/booking/${bs[0].id}" style="cursor:pointer"` : ""}><div class="row" style="justify-content:space-between"><span class="tnum ${d === TODAY ? "price" : ""}">${pyd(d).getUTCDate()}</span>${trip ? `<span class="xs" style="color:var(--accent)">${CITIES[trip.city]}</span>` : ""}</div>${bs.map((b) => `<span class="ev ${b.isPublic ? "pub" : "prv"}">${b.start} ${esc(b.isPublic ? S.venues[b.buyer]?.name ?? b.title : b.title)}</span>`).join("")}</div>`;
  }).join("")}</div><p class="sm muted">${t("calHint")}</p>`;
}

function bookingRows(list) {

  return `<div class="card">${list.map((b) => { const a = artist(b.artist); return `<div class="row" style="padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer" data-act="open" data-h="#/booking/${b.id}"><div style="width:56px;text-align:center"><div class="price sm tnum">${fdate(b.date)}</div><div class="xs muted">${b.start}</div></div><img src="${img(a.photo)}" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover"><div class="grow"><div class="sm b trunc">${esc(b.title)}</div><div class="xs muted">${esc(a.name)} · ${CITIES[b.city]}</div></div>${statusBadge(b.status)}</div>`; }).join("")}</div>`;

      : bookingRows(S.bookings.filter((b) => b.buyerKind === "client"));
    return `<div class="wrap" style="margin-top:28px"><div class="card pad"><h1 style="font-size:24px">Olive</h1><div class="sm muted">Admin · Canada</div></div><div class="tabs">${["fees", "allBookings"].map((k) => `<button class="${tab === k ? "on" : ""}" data-act="tab" data-v="${k}">${t(k)}</button>`).join("")}</div><div style="margin-top:16px">${body}</div></div>`;
  }
  return `<div class="wrap"><div class="card pad" style="margin-top:28px">${t("noAccess")}</div></div>`;
}

function render() {
  const { parts, q } = route();
  let main;
  if (parts[0] === "artists") main = viewArtists(q);
  else if (parts[0] === "artist") main = viewArtist(parts[1]);
  else if (parts[0] === "request") main = viewRequest(parts[1], q);
  else if (parts[0] === "booking") main = viewBooking(parts[1]);
  else if (parts[0] === "dashboard") main = viewDashboard();
  else main = viewHome();
  document.documentElement.lang = S.lang;
  $app.innerHTML = header() + `<main>${main}</main><footer><div class="wrap"><span>${t("footer")}</span><span>LiveStage · Canada demo</span></div></footer>` + guide() + (toastMsg ? `<div class="toast">${esc(toastMsg)}</div>` : "");
  if (highlight) {
    const el = $app.querySelector(`[data-hl="${highlight}"]`);
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.add("hl"); setTimeout(() => el.classList.remove("hl"), 2600); }
    highlight = null;
  }
}

/* ---------------- interactions ---------------- */
let qvTimer;
$app.addEventListener("mouseover", (e) => {
  const w = e.target.closest("[data-qv]"); if (!w || w.querySelector(".qv")) return;
  clearTimeout(qvTimer); qvTimer = setTimeout(() => { closeQv(); w.insertAdjacentHTML("beforeend", quickView(artist(w.dataset.qv))); }, 180);
});
$app.addEventListener("mouseout", (e) => {
  const w = e.target.closest("[data-qv]"); if (!w || w.contains(e.relatedTarget)) return;
  clearTimeout(qvTimer); qvTimer = setTimeout(() => w.querySelector(".qv")?.remove(), 150);
});
const closeQv = () => $app.querySelectorAll(".qv").forEach((x) => x.remove());

$app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  const b = id ? S.bookings.find((x) => x.id === id) : null;
  if (act === "qv") { e.preventDefault(); const w = el.closest("[data-qv]"); if (w.querySelector(".qv")) closeQv(); else { closeQv(); w.insertAdjacentHTML("beforeend", quickView(artist(id))); } return; }
  if (act === "lang") { S.lang = v; save(); render(); return; }
  if (act === "reset") { const lang = S.lang; S = seed(); S.lang = lang; save(); toast(t("t_reset")); go("#/"); render(); return; }
  if (act === "guide") { guideOpen = !guideOpen; render(); return; }
  if (act === "open") { go(el.dataset.h); return; }
  if (act === "become") { S.role = v; save(); go(el.dataset.h); render(); return; }
  if (act === "step") { const s = STEPS[+v]; S.role = s.role; dashTab = s.tab || null; save(); highlight = s.hl || null; if (window.innerWidth < 860) guideOpen = false; if (location.hash === s.h) render(); else go(s.h); return; }
  if (act === "tab") { dashTab = v; render(); return; }
  if (act === "month") { const [y, m] = calMonth.split("-").map(Number); const d = new Date(Date.UTC(y, m - 1 + Number(v), 1)); calMonth = d.toISOString().slice(0, 7); render(); return; }
  if (act === "toggleDay") { const a = artist(S.role); a.blocked = a.blocked.includes(v) ? a.blocked.filter((x) => x !== v) : [...a.blocked, v]; save(); render(); return; }
  if (act === "rmTrip") { const a = artist(S.role); a.travel.splice(+v, 1); save(); render(); return; }
  if (act === "agree" && b && side(b) === "artist") { b.contract.artistAt = now(); save(); render(); return; }
  if (act === "acceptQuote" && b && side(b) === "buyer" && b.status === "quoted") {
    if (!b.contract) reviseByArtist(b);
    b.contract.buyerAt = now(); b.status = "pending_payment"; b.history.push([now(), "h_acc", {}]); save(); toast(t("t_acc")); highlight = "pay"; render(); return;
  }
  if (act === "pay" && b && side(b) === "buyer" && b.status === "pending_payment") {
    const amount = Math.round((contractTotal(b.contract) * b.contract.terms.deposit) / 100);
    b.payment = { amount, at: now() }; b.status = "confirmed"; b.history.push([now(), "h_paid", { p: b.contract.terms.deposit }]); save(); toast(t("t_paid")); highlight = "parties"; window.scrollTo({ top: 0, behavior: "smooth" }); render(); return;
  }
});
$app.addEventListener("change", (e) => { if (e.target.dataset.act === "role") { S.role = e.target.value; dashTab = null; save(); render(); } });

$app.addEventListener("submit", (e) => {
  const f = e.target.closest("form"); if (!f) return; e.preventDefault();
  const fd = new FormData(f), kind = f.dataset.form, b = f.dataset.id ? S.bookings.find((x) => x.id === f.dataset.id) : null;
  if (kind === "search") { const q = new URLSearchParams([...fd].filter(([, v]) => v)); go("#/artists" + (q.toString() ? "?" + q : "")); return; }
  if (kind === "request") {
    const a = bySlug(f.dataset.slug), title = String(fd.get("title")).trim(), date = String(fd.get("date")), address = String(fd.get("address")).trim(), city = String(fd.get("city"));
    const err = (m) => { f.querySelector("#req-err").textContent = m; };
    if (!title || !date || !address) return err(t("errReq"));
    if (date < TODAY) return err(t("errDate"));
    if (!availableOn(a, city, date)) return err(t("errAvail", { city: CITIES[city] }));
    const nb = { id: "n" + S.seq++, artist: a.id, buyerKind: "client", buyer: S.role, title, event: String(fd.get("event")), date, start: String(fd.get("start") || "19:00"), hours: Number(fd.get("hours")) || 3, city, address, guests: Number(fd.get("guests")) || 0,
      notes: String(fd.get("notes") || "").trim(), isPublic: false, status: "new", quote: null, setlist: fd.getAll("setlist").map(String),
      requests: [0, 1].map((i) => ({ title: String(fd.get("rt" + i) || "").trim(), orig: String(fd.get("ra" + i) || "").trim(), note: String(fd.get("rn" + i) || "").trim() })).filter((r) => r.title).map((r, i) => ({ id: "q" + i, status: "pending", fee: 0, ...r })),
      contract: null, messages: [], history: [[now(), "h_req", {}]], payment: null };
    S.bookings.push(nb); save(); toast(t("t_sent")); go("#/booking/" + nb.id); return;
  }
  if (kind === "quote" && b && side(b) === "artist") {
    const price = Math.round(Number(fd.get("price")) * 100); if (!(price > 0)) return;
    b.quote = { price, overtime: b.quote?.overtime ?? 0, deposit: Number(fd.get("deposit")) || 30 }; b.status = "quoted"; reviseByArtist(b);
    b.history.push([now(), "h_quote", { v: b.contract.v }]); save(); toast(t("t_quote", { v: b.contract.v })); highlight = "contract"; render(); return;
  }
  if (kind === "song" && b && side(b) === "artist") {
    const r = b.requests.find((x) => x.id === f.dataset.r), accept = (e.submitter?.value ?? "accept") === "accept";
    r.status = accept ? "accepted" : "declined"; r.fee = accept ? Math.max(0, Math.round(Number(fd.get("fee") || 0) * 100)) : 0;
    if (b.quote && reviseByArtist(b)) { b.history.push([now(), "h_song", { s: S.lang === "vi" ? (accept ? "Nhận" : "Không nhận") : accept ? "Accepted" : "Declined", t: r.title, v: b.contract.v }]); toast(t("t_song", { v: b.contract.v })); }
    if (b.status === "pending_payment") b.status = "quoted"; // changed terms need the client's agreement again
    save(); highlight = "contract"; render(); return;
  }
  if (kind === "msg" && b) {
    const text = String(fd.get("text") || "").trim(); const sd = side(b); if (!text || !sd) return;
    b.messages.push({ from: sd === "admin" ? "admin" : sd, text, at: now() }); save(); render();
    document.getElementById("messages")?.scrollIntoView({ block: "center" }); return;
  }
  if (kind === "trip") {
    const a = artist(S.role), from = String(fd.get("from")), to = String(fd.get("to")), city = String(fd.get("city")), note = String(fd.get("note") || "").trim();
    if (!from || !to || from > to || a.travel.some((w) => !(to < w.from || from > w.to))) return;
    a.travel.push({ from, to, city, note: { en: note, vi: note } }); a.travel.sort((x, y) => x.from.localeCompare(y.from)); save(); render(); return;
  }
  if (kind === "fee") { const a = artist(f.dataset.id); const pct = Number(fd.get("pct")); if (pct >= 0 && pct <= 50) { a.fee = Math.round(pct * 100); save(); toast(t("saved")); render(); } }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeQv(); if (guideOpen) { guideOpen = false; render(); } } });
window.addEventListener("hashchange", () => { closeQv(); render(); window.scrollTo(0, 0); });
render();
</script>
