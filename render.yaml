# Render Blueprint for the interactive demo: one long-lived Node process, because demo data lives in memory.
services:
  - type: web
    name: livestage-demo
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /en
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "1"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
